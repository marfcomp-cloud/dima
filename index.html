<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ДИМА</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 30% 20%, #1e293b 0%, #0f172a 55%, #020617 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      overflow: hidden;
    }

    .glow {
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.22), rgba(168, 85, 247, 0.08), transparent 70%);
      filter: blur(40px);
      pointer-events: none;
      animation: pulse 6s ease-in-out infinite alternate;
    }

    h1 {
      position: relative;
      font-size: clamp(4.5rem, 18vw, 12rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, #f8fafc 0%, #38bdf8 50%, #a855f7 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      user-select: none;
      text-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes pulse {
      from {
        transform: scale(0.92);
        opacity: 0.7;
      }
      to {
        transform: scale(1.12);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <h1>ДИМА</h1>
</body>
</html>
